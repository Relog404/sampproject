<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Railway — спидометр</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="hud" id="hud">

    <div class="meta">
      <span class="car" id="car">Транспорт</span>
      <span class="owner" id="owner">ваша машина</span>
    </div>

    <div class="dial">
      <svg class="gauge" viewBox="0 0 220 220" aria-hidden="true">
        <defs>
          <linearGradient id="arcFill" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0%"   stop-color="#7FB6FF"/>
            <stop offset="45%"  stop-color="#F5C451"/>
            <stop offset="100%" stop-color="#FF9A5A"/>
          </linearGradient>
          <filter id="arcGlow" x="-25%" y="-25%" width="150%" height="150%">
            <feGaussianBlur stdDeviation="3.4" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>

        <circle class="dial-bg" cx="110" cy="110" r="86"/>
        <circle class="track" cx="110" cy="110" r="86"
                transform="rotate(135 110 110)"/>
        <circle class="redline" id="redline" cx="110" cy="110" r="86"
                transform="rotate(135 110 110)"/>
        <circle class="arc" id="arc" cx="110" cy="110" r="86"
                transform="rotate(135 110 110)"/>
        <g class="ticks" id="ticks"></g>
        <line class="needle" id="needle" x1="110" y1="110" x2="110" y2="42"/>
        <circle class="hub" cx="110" cy="110" r="4.4"/>
      </svg>

      <div class="readout">
        <span class="speed" id="speed">0</span>
        <span class="unit">км/ч</span>
      </div>

      <div class="gear" id="gear">
        <span class="gear-value" id="gear-value">N</span>
        <span class="gear-label">передача</span>
      </div>
    </div>

    <div class="chips">
      <span class="chip" id="chip-key"><i></i>ключ</span>
      <span class="chip" id="chip-engine"><i></i>двигатель</span>
      <span class="chip" id="chip-door"><i></i>двери</span>
    </div>

    <div class="locked" id="locked">
      <span class="locked-dot"></span>двигатель заблокирован
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>

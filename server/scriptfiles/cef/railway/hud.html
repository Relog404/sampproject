<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Railway HUD</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body class="hud-body">
<div class="hud" id="hud">

  <!-- Подсказки клавиш -->
  <div class="hints" id="hints"></div>

  <!-- Карточка бонуса: сворачивается кнопкой, разворачивается нажатием -->
  <div class="bonus" id="bonus">
    <div class="bonus-head">
      <span class="bonus-head-title" id="bonusHead">Бонус</span>
      <button class="bonus-min" id="bonusClose" type="button" title="Свернуть">–</button>
    </div>
    <div class="bonus-body">
      <img class="bonus-art" id="bonusArt" src="img/bonus.png" alt="">
      <div class="bonus-title" id="bonusTitle"></div>
      <div class="bonus-text" id="bonusText"></div>
      <button class="bonus-go" id="bonusGo" type="button"></button>
    </div>
  </div>

  <!-- Спидометр: показывает страница, сервер только шлёт цифры -->
  <div class="speedo" id="speedo">
    <div class="speedo-name" id="speedoName"></div>
    <div class="speedo-value"><span id="speedoNum">000</span><span class="speedo-unit">км/ч</span></div>
    <div class="speedo-gear" id="speedoGear">N</div>
    <div class="speedo-flags" id="speedoFlags"></div>
    <div class="speedo-rpm"><div class="speedo-rpm-fill" id="speedoRpm"></div></div>
  </div>

</div>
<script src="js/bridge.js"></script>
<script src="js/hud.js"></script>
</body>
</html>

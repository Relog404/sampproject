<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Railway HUD</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body class="hud-body">
<div class="hud" id="hud">

  <!-- Подсказки клавиш -->
  <div class="hints" id="hints"></div>

  <!-- Кошелёк и время: стоит справа от штатного радара -->
  <div class="wallet" id="wallet">
    <div class="wallet-row"><span class="wallet-label">Банк</span><span class="wallet-sum" id="walletBank">0</span></div>
    <div class="wallet-row"><span class="wallet-label">Наличные</span><span class="wallet-sum" id="walletCash">0</span></div>
    <div class="wallet-row wallet-clock"><span class="wallet-label">Москва</span><span class="wallet-time" id="walletTime">--:--</span></div>
  </div>

  <!-- Навигатор: куда стоит метка и сколько осталось -->
  <div class="gps" id="gps"></div>

  <!-- Спидометр: показывает страница, сервер только шлёт цифры -->
  <div class="ground" id="ground"></div>
  <div class="speedo" id="speedo">
    <div class="speedo-name" id="speedoName"></div>
    <div class="speedo-value"><span id="speedoNum">000</span><span class="speedo-unit">км/ч</span></div>
    <div class="speedo-gear" id="speedoGear">N</div>
    <div class="speedo-flags" id="speedoFlags"></div>
    <div class="speedo-rpm"><div class="speedo-rpm-fill" id="speedoRpm"></div></div>
  </div>

</div>
<script src="js/bridge.js"></script>
<script src="js/hud.js"></script>
</body>
</html>

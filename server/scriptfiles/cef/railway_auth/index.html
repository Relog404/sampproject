<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Железнодорожный вокзал — вход</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="veil"></div>
  <div class="rails" aria-hidden="true"></div>

  <main class="stage">
    <section class="card" id="card">

      <header class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6"
               stroke-linecap="round" stroke-linejoin="round">
            <circle cx="16" cy="16" r="13" opacity=".28"/>
            <path class="logo-track" d="M9 22.5 16 8l7 14.5"/>
            <path class="logo-line" d="M11.2 18.6h9.6"/>
            <circle cx="16" cy="8" r="1.5" fill="currentColor" stroke="none"/>
          </svg>
        </span>
        <span class="brand-text">
          <h1>Железнодорожный вокзал</h1>
          <p>LOS SANTOS · UNITY STATION</p>
        </span>
        <span class="version" id="version">v1.0.0</span>
      </header>

      <div class="tabs" id="tabs" role="tablist">
        <span class="pill" id="pill" aria-hidden="true"></span>
        <button class="tab is-active" type="button" data-mode="login" role="tab" aria-selected="true">Вход</button>
        <button class="tab" type="button" data-mode="register" role="tab" aria-selected="false">Регистрация</button>
      </div>

      <form class="form" id="form" autocomplete="off" novalidate>

        <label class="field" id="field-pass">
          <span class="field-label">Пароль</span>
          <span class="field-box">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="4.5" y="10.5" width="15" height="9.5" rx="2.6"/>
              <path d="M8.2 10.5V7.8a3.8 3.8 0 0 1 7.6 0v2.7"/>
              <circle cx="12" cy="15.3" r="1.15" fill="currentColor" stroke="none"/>
            </svg>
            <input type="password" id="pass" name="pass" maxlength="64" spellcheck="false"
                   autocomplete="new-password" placeholder="минимум 6 символов" aria-describedby="msg-pass">
            <button class="eye" type="button" id="eye" aria-label="Показать пароль">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2.5 12S6 5.8 12 5.8 21.5 12 21.5 12 18 18.2 12 18.2 2.5 12 2.5 12Z"/>
                <circle cx="12" cy="12" r="2.6"/>
              </svg>
            </button>
          </span>
          <span class="field-msg" id="msg-pass"></span>
        </label>

        <label class="field field-repeat" id="field-repeat">
          <span class="field-label">Повторите пароль</span>
          <span class="field-box">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 3.5 4.6 6.4v5.2c0 4.3 3.1 7.4 7.4 9 4.3-1.6 7.4-4.7 7.4-9V6.4Z"/>
              <path d="m8.9 11.8 2.2 2.2 4-4.2"/>
            </svg>
            <input type="password" id="pass2" name="pass2" maxlength="64" spellcheck="false"
                   autocomplete="new-password" placeholder="ещё раз">
          </span>
          <span class="field-msg" id="msg-repeat"></span>
        </label>

        <div class="strength" id="strength" aria-hidden="true">
          <div class="bars"><i></i><i></i><i></i><i></i></div>
          <span class="strength-text" id="strength-text">надёжность пароля</span>
        </div>

        <button class="submit" id="submit" type="submit">
          <span class="submit-label" id="submit-label">Войти на вокзал</span>
          <span class="spinner" aria-hidden="true"></span>
          <span class="done" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                 stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
          </span>
        </button>

      </form>

      <footer class="foot">
        <div class="player">
          <span class="avatar" id="avatar" aria-hidden="true">?</span>
          <span class="player-name" id="nick">подключение…</span>
        </div>
        <span class="hint" id="hint">Enter <b>↵</b></span>
      </footer>

    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <span class="toast-dot" id="toast-dot"></span>
    <span class="toast-text" id="toast-text"></span>
  </div>

  <script src="bridge.js"></script><script src="app.js"></script>
</body>
</html>
